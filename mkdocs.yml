site_name: terrazarr
site_description: GeoZarr multiscale pyramids for planetary-scale rasters
site_url: https://mindearth.github.io/terrazarr/
repo_url: https://github.com/mindearth/terrazarr
theme:
  name: material
  features: [navigation.sections, content.code.copy, toc.integrate]
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: dark }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: light }
nav:
  - Overview: index.md
  - API: api.md
  - Benchmarks: benchmarks.md
  - Demo: demo.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            members_order: source
markdown_extensions:
  - tables
  - toc: { permalink: true }
  - admonition
